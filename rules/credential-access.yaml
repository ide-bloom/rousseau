# Credential access by agent process trees.
# Paths match case-insensitively; `*` crosses directory separators.
id: ROU-001
title: Agent tree reads SSH private keys
severity: high
description: >
  A process in an AI agent's tree read a file in an .ssh directory that looks
  like a private key. Coding agents rarely need private keys directly; a
  prompt-injected agent or a malicious tool reading them is a classic
  credential-theft step.
references:
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications/
  - https://attack.mitre.org/techniques/T1552/004/
owasp: [ASI03, ASI02]
mitre: [T1552.004]
falsepositives:
  - ssh.exe, ssh-agent.exe and git's SSH transport read keys during legitimate pushes; they are excluded.
  - Agents asked to configure SSH for the user.
detection:
  type: event
  where:
    all:
      - descendant_of_agent: true
      - field: kind
        equals: file.read
      - field: file.path
        glob: ["*/.ssh/*"]
      - not:
          field: file.path
          endswith: [".pub", "known_hosts", "known_hosts.old", "config", "authorized_keys"]
      - not:
          field: process.name
          in: [ssh.exe, ssh-agent.exe, ssh-add.exe, scp.exe, sftp.exe, git-remote-https.exe]
---
id: ROU-002
title: Agent tree reads cloud CLI credentials
severity: high
description: >
  A process in an agent tree read credential material written by cloud and
  container CLIs (AWS, Azure, Google Cloud, Kubernetes, Docker). These files
  grant direct access to production infrastructure.
references:
  - https://attack.mitre.org/techniques/T1552/001/
owasp: [ASI03, ASI02]
mitre: [T1552.001]
falsepositives:
  - The cloud CLI itself (aws.exe, az, gcloud, kubectl) launched by the agent for a deployment task; native CLIs are excluded by name. Python-based CLIs (gcloud, az on some installs) run as python.exe and are deliberately not excluded.
detection:
  type: event
  where:
    all:
      - descendant_of_agent: true
      - field: kind
        equals: file.read
      - field: file.path
        glob:
          - "*/.aws/credentials"
          - "*/.aws/sso/cache/*"
          - "*/.azure/msal_token_cache*"
          - "*/.azure/accessTokens.json"
          - "*/gcloud/credentials.db"
          - "*/gcloud/access_tokens.db"
          - "*/gcloud/application_default_credentials.json"
          - "*/.kube/config"
          - "*/.docker/config.json"
      - not:
          field: process.name
          in: [aws.exe, az.exe, gcloud.exe, kubectl.exe, docker.exe, docker-credential-desktop.exe, helm.exe, terraform.exe]
---
id: ROU-003
title: Agent tree reads browser credential or cookie stores
severity: critical
description: >
  A process in an agent tree opened a browser's saved-password database
  (Login Data) or cookie jar. There is no legitimate coding reason for this;
  it is the signature move of info-stealers.
references:
  - https://attack.mitre.org/techniques/T1555/003/
  - https://attack.mitre.org/techniques/T1539/
owasp: [ASI03, ASI10]
mitre: [T1555.003, T1539]
falsepositives:
  - Browser automation tools (Playwright, Puppeteer) launched against the user's real profile.
detection:
  type: event
  where:
    all:
      - descendant_of_agent: true
      - field: kind
        equals: file.read
      - field: file.path
        glob:
          - "*/User Data/*/Login Data"
          - "*/User Data/*/Login Data For Account"
          - "*/User Data/*/Network/Cookies"
          - "*/User Data/*/Cookies"
          - "*/User Data/Local State"
          - "*/Mozilla/Firefox/Profiles/*/logins.json"
          - "*/Mozilla/Firefox/Profiles/*/key4.db"
          - "*/Mozilla/Firefox/Profiles/*/cookies.sqlite"
      - not:
          field: process.name
          in: [chrome.exe, msedge.exe, firefox.exe, brave.exe]
---
id: ROU-004
title: Agent tree reads password manager vaults
severity: critical
description: >
  A process in an agent tree read a password-manager vault or local data
  file (KeePass, Bitwarden, 1Password). Even encrypted vaults are valuable
  for offline cracking.
references:
  - https://attack.mitre.org/techniques/T1555/005/
owasp: [ASI03, ASI10]
mitre: [T1555.005]
falsepositives:
  - The user asked the agent to back up or migrate a vault.
detection:
  type: event
  where:
    all:
      - descendant_of_agent: true
      - field: kind
        equals: file.read
      - any:
          - field: file.ext
            in: [kdbx, kdb, opvault, 1pif]
          - field: file.path
            glob:
              - "*/Bitwarden/data.json"
              - "*/1Password/data/*.sqlite"
              - "*/1Password/*/1password.sqlite"
              - "*/Dashlane/*/Data/*"
---
id: ROU-005
title: Agent tree reads another tool's access tokens
severity: high
description: >
  A process in an agent tree read token files belonging to other agents or
  developer tools: Claude Code, Codex, Gemini CLI, GitHub CLI, npm, PyPI,
  git credential stores. Stealing a sibling agent's token is a known
  lateral-movement path between agents.
references:
  - https://attack.mitre.org/techniques/T1528/
  - https://attack.mitre.org/techniques/T1552/001/
owasp: [ASI03, ASI07]
mitre: [T1528, T1552.001]
falsepositives:
  - The owning tool itself (gh.exe, npm, git credential helpers) running under the agent; excluded by name.
  - An agent reading its own token file at startup (agent root process, depth 0) is excluded.
detection:
  type: event
  where:
    all:
      - descendant_of_agent: true
      - field: kind
        equals: file.read
      - field: lineage.depth
        gte: 1
      - field: file.path
        glob:
          - "*/.claude/.credentials.json"
          - "*/.codex/auth.json"
          - "*/.gemini/oauth_creds.json"
          - "*/GitHub CLI/hosts.yml"
          - "*/gh/hosts.yml"
          - "*/.npmrc"
          - "*/.pypirc"
          - "*/.git-credentials"
          - "*/.config/hub"
          - "*/.netrc"
          - "*/_netrc"
      - not:
          field: process.name
          in: [gh.exe, git.exe, git-credential-manager.exe, npm.exe, node.exe, twine.exe, pip.exe]
---
id: ROU-006
title: Credential read followed by outbound connection
severity: critical
description: >
  Within one agent tree, a credential file was read and an outbound
  connection to a public address followed within 60 seconds. This
  read-then-send pattern is the core of credential exfiltration.
references:
  - https://attack.mitre.org/techniques/T1041/
  - https://attack.mitre.org/techniques/T1552/
owasp: [ASI02, ASI03]
mitre: [T1552, T1041]
falsepositives:
  - A deployment that loads cloud credentials and then calls the cloud API.
response:
  suspend_tree: true
detection:
  type: sequence
  by: [lineage.root]
  within: 60s
  steps:
    - name: credential read
      where:
        all:
          - descendant_of_agent: true
          - field: kind
            equals: file.read
          - field: file.path
            glob:
              - "*/.ssh/id_*"
              - "*/.aws/credentials"
              - "*/.azure/msal_token_cache*"
              - "*/gcloud/credentials.db"
              - "*/.kube/config"
              - "*/User Data/*/Login Data"
              - "*/User Data/*/Network/Cookies"
              - "*/.claude/.credentials.json"
              - "*/.codex/auth.json"
              - "*/.git-credentials"
              - "*/.npmrc"
              - "*.kdbx"
          - not:
              field: file.path
              endswith: ".pub"
          - not:
              field: process.name
              in: [ssh.exe, ssh-agent.exe, git-remote-https.exe]
    - name: outbound connection
      where:
        all:
          - field: kind
            equals: net.connect
          - field: net.remote_scope
            equals: public
          - not:
              field: process.name
              in: [ssh.exe, git-remote-https.exe]
