[package]
name = "rousseau-cli"
description = "rousseau.exe: EDR for AI coding agents on Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "rousseau"
path = "src/main.rs"

[dependencies]
rousseau-core.workspace = true
rousseau-etw.workspace = true
rousseau-mcp.workspace = true
rousseau-adapters.workspace = true
rousseau-server.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_EventLog",
] }

[dev-dependencies]
tempfile.workspace = true

[features]
# Integration tests that start real ETW sessions and run the demo scenario
# (need an elevated shell and Python 3.12+).
integration = []
# Optional on-device prompt-injection classifier (ONNX Runtime).
ml = ["rousseau-mcp/ml"]
