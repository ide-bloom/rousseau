# Field operators. Each document is one conformance case.
name: equals is case-insensitive by default; numbers compare numerically
rule:
  id: C-001
  title: equals
  severity: low
  detection:
    where:
      any:
        - {field: process.name, equals: PowerShell.EXE}
        - {field: net.remote_port, equals: 443}
events:
  - {id: 1, ts: 1, kind: process.start, process: {pid: 1, name: powershell.exe}}
  - {id: 2, ts: 2, kind: process.start, process: {pid: 2, name: pwsh.exe}}
  - {id: 3, ts: 3, kind: net.connect, net: {remote_port: 443}}
  - {id: 4, ts: 4, kind: net.connect, net: {remote_port: 4430}}
expected:
  - {events: [1]}
  - {events: [3]}
---
name: case_sensitive turns off folding for equals and contains
rule:
  id: C-002
  title: case
  severity: low
  detection:
    where:
      any:
        - {field: a, equals: Foo, case_sensitive: true}
        - {field: b, contains: BAR, case_sensitive: true}
events:
  - {id: 1, ts: 1, kind: x, a: foo}
  - {id: 2, ts: 2, kind: x, a: Foo}
  - {id: 3, ts: 3, kind: x, b: xxbarxx}
  - {id: 4, ts: 4, kind: x, b: xxBARxx}
expected:
  - {events: [2]}
  - {events: [4]}
---
name: contains, startswith and endswith accept lists meaning any
rule:
  id: C-003
  title: string ops
  severity: low
  detection:
    where:
      all:
        - {field: s, contains: [alpha, beta]}
        - {field: s, startswith: ["x-", "y-"]}
        - {field: s, endswith: [".log", ".txt"]}
events:
  - {id: 1, ts: 1, kind: x, s: x-BETA.TXT}
  - {id: 2, ts: 2, kind: x, s: z-beta.txt}
  - {id: 3, ts: 3, kind: x, s: y-gamma.log}
  - {id: 4, ts: 4, kind: x, s: y-alpha.log}
expected:
  - {events: [1]}
  - {events: [4]}
---
name: glob star crosses separators, slash matches either separator, whole value must match
rule:
  id: C-004
  title: glob
  severity: low
  detection:
    where: {field: file.path, glob: "*/.ssh/id_*"}
events:
  - {id: 1, ts: 1, kind: file.read, file: {path: 'C:\Users\a\.ssh\id_ed25519'}}
  - {id: 2, ts: 2, kind: file.read, file: {path: '/home/a/.ssh/id_rsa'}}
  - {id: 3, ts: 3, kind: file.read, file: {path: 'C:\Users\a\.SSH\ID_RSA'}}
  - {id: 4, ts: 4, kind: file.read, file: {path: 'C:\Users\a\.ssh\known_hosts'}}
  - {id: 5, ts: 5, kind: file.read, file: {path: 'C:\Users\a\.ssh\id_rsa\..\x'}}
expected:
  - {events: [1]}
  - {events: [2]}
  - {events: [3]}
  - {events: [5]}
---
name: glob question mark is one character; regex metacharacters are literal
rule:
  id: C-005
  title: glob literal
  severity: low
  detection:
    where: {field: s, glob: "a?c.(1)+[x]"}
events:
  - {id: 1, ts: 1, kind: x, s: "abc.(1)+[x]"}
  - {id: 2, ts: 2, kind: x, s: "ac.(1)+[x]"}
  - {id: 3, ts: 3, kind: x, s: "abc.1+x"}
  - {id: 4, ts: 4, kind: x, s: "aXc.(1)+[X]"}
expected:
  - {events: [1]}
  - {events: [4]}
---
name: regex is an unanchored, case-insensitive search
rule:
  id: C-006
  title: regex
  severity: low
  detection:
    where: {field: process.command_line, regex: '\s-enc\s+[A-Za-z0-9+/=]{8,}'}
events:
  - {id: 1, ts: 1, kind: process.start, process: {command_line: 'powershell -ENC SQBFAFgAIAAoAE4A'}}
  - {id: 2, ts: 2, kind: process.start, process: {command_line: 'powershell -enc abc'}}
  - {id: 3, ts: 3, kind: process.start, process: {command_line: 'powershell -Command Get-Date'}}
expected:
  - {events: [1]}
---
name: in matches any listed scalar with equals semantics
rule:
  id: C-007
  title: in
  severity: low
  detection:
    where: {field: v, in: [Curl.exe, 8080, true]}
events:
  - {id: 1, ts: 1, kind: x, v: curl.exe}
  - {id: 2, ts: 2, kind: x, v: 8080}
  - {id: 3, ts: 3, kind: x, v: "8080"}
  - {id: 4, ts: 4, kind: x, v: true}
  - {id: 5, ts: 5, kind: x, v: wget.exe}
expected:
  - {events: [1]}
  - {events: [2]}
  - {events: [3]}
  - {events: [4]}
---
name: exists treats null and missing alike
rule:
  id: C-008
  title: exists
  severity: low
  detection:
    where:
      all:
        - {field: lineage.mcp_server, exists: false}
        - {field: file, exists: true}
events:
  - {id: 1, ts: 1, kind: x, file: {path: a}}
  - {id: 2, ts: 2, kind: x, file: {path: a}, lineage: {mcp_server: null}}
  - {id: 3, ts: 3, kind: x, file: {path: a}, lineage: {mcp_server: srv}}
  - {id: 4, ts: 4, kind: x}
expected:
  - {events: [1]}
  - {events: [2]}
---
name: gt/gte/lt/lte compare numbers only; strings never match
rule:
  id: C-009
  title: numeric
  severity: low
  detection:
    where:
      all:
        - {field: n, gt: 10}
        - {field: n, lte: 20}
events:
  - {id: 1, ts: 1, kind: x, n: 10}
  - {id: 2, ts: 2, kind: x, n: 11}
  - {id: 3, ts: 3, kind: x, n: 20}
  - {id: 4, ts: 4, kind: x, n: 21}
  - {id: 5, ts: 5, kind: x, n: "15"}
  - {id: 6, ts: 6, kind: x, n: 15.5}
expected:
  - {events: [2]}
  - {events: [3]}
  - {events: [6]}
---
name: arrays along a path are flattened; any element may match
rule:
  id: C-010
  title: arrays
  severity: low
  detection:
    where: {field: items.tags, equals: secret}
events:
  - {id: 1, ts: 1, kind: x, items: [{tags: [a, b]}, {tags: [SECRET]}]}
  - {id: 2, ts: 2, kind: x, items: [{tags: [a]}, {name: secret}]}
  - {id: 3, ts: 3, kind: x, items: {tags: secret}}
expected:
  - {events: [1]}
  - {events: [3]}
---
name: string operators see integers without a fraction and booleans as true/false
rule:
  id: C-021
  title: coercion
  severity: low
  detection:
    where:
      any:
        - {field: port, startswith: "44"}
        - {field: flag, equals: "TRUE"}
events:
  - {id: 1, ts: 1, kind: x, port: 443}
  - {id: 2, ts: 2, kind: x, port: 8443}
  - {id: 3, ts: 3, kind: x, flag: true}
  - {id: 4, ts: 4, kind: x, flag: false}
expected:
  - {events: [1]}
  - {events: [3]}
