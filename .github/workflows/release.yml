name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          $name = "rousseau-${{ github.ref_name }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/rousseau.exe, README.md, LICENSE dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip-${{ matrix.arch }}
          path: dist/*.zip

  lab:
    name: Build rousseau-lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build lab --outdir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-dist
          path: dist/*

  release:
    name: GitHub release
    needs: [build, lab]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zip-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS

  # PyPI trusted publishing is configured on pypi.org, so the workflow cannot
  # detect it. Publishing is opt-in: set the repository variable
  # PYPI_TRUSTED_PUBLISHING to "true" once the trusted publisher exists
  # (Settings → Secrets and variables → Actions → Variables). Otherwise the
  # job is skipped and the release still succeeds.
  pypi:
    name: Publish rousseau-lab to PyPI
    needs: [release]
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  pypi-skipped:
    name: PyPI publishing not enabled
    needs: [release]
    if: vars.PYPI_TRUSTED_PUBLISHING != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain the skip
        run: |
          echo "::notice title=PyPI publish skipped::Set the repository variable PYPI_TRUSTED_PUBLISHING=true after configuring the trusted publisher on PyPI."
          {
            echo "### rousseau-lab was not published to PyPI"
            echo "PyPI trusted publishing is opt-in. Configure a trusted publisher for this repository and the \`release.yml\` workflow (environment \`pypi\`) on pypi.org,"
            echo "then set the repository variable \`PYPI_TRUSTED_PUBLISHING\` to \`true\`. The sdist and wheel are attached to this run as the \`lab-dist\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
